<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>牛顿环装置 · 三维模型</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2319231f'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23dff0e9' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23dff0e9'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      background: #0f1714;
      color: #eef5f1;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background:
        linear-gradient(rgba(138, 167, 155, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(138, 167, 155, 0.07) 1px, transparent 1px),
        #0f1714;
      background-size: 48px 48px;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 18px 22px;
      pointer-events: none;
      background: linear-gradient(rgba(15, 23, 20, 0.86), transparent);
    }
    header a, header span {
      pointer-events: auto;
      color: #aabdb4;
      text-decoration: none;
      font-size: 11px;
    }
    header a {
      padding: 8px 11px;
      border: 1px solid rgba(160, 190, 176, 0.25);
      border-radius: 5px;
      background: rgba(15, 23, 20, 0.72);
    }
    header a:hover { color: #fff; border-color: rgba(160, 220, 197, 0.5); }
    .brand { display: flex; flex-direction: column; gap: 2px; }
    .brand strong { color: #f0f6f3; font-size: 13px; font-weight: 600; }
    .brand small {
      color: #73887e;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 8px;
      letter-spacing: 0.09em;
    }
    .hint {
      position: fixed;
      right: 20px;
      bottom: 17px;
      z-index: 2;
      color: #71867c;
      font-size: 9px;
      pointer-events: none;
    }
    .loader {
      position: fixed;
      inset: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      background: #0f1714;
      transition: opacity 180ms ease;
    }
    .loader.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 29px;
      height: 29px;
      border: 2px solid #2c4338;
      border-top-color: #70c0a7;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    .loader strong { font-size: 12px; font-weight: 500; }
    .loader small {
      color: #71867c;
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "./libs/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="deviceCanvas" aria-label="牛顿环实验装置三维模型"></canvas>
  <header>
    <div class="brand">
      <strong>牛顿环读数显微镜 · 数字模型</strong>
      <small>MICROSCOPE ASSEMBLY / SODIUM LAMP UPDATED</small>
    </div>
    <a href="./innovation-demo.html#device">返回实时演示</a>
  </header>
  <div class="hint">拖动旋转 · 滚轮缩放 · 右键平移</div>
  <div class="loader" id="loader">
    <span class="spinner"></span>
    <strong>正在载入整体装置模型</strong>
    <small>FINAL LIGHTPATH · LIVE RIG</small>
  </div>
  <script type="module">
    import { initDeviceViewer } from "./model-viewer.js?v=range50-v3";

    initDeviceViewer({
      canvas: document.getElementById("deviceCanvas"),
      onReady() {
        document.getElementById("loader").classList.add("hidden");
      },
      onError(error) {
        const loader = document.getElementById("loader");
        loader.innerHTML = `<strong>模型载入失败</strong><small>${String(error.message || error)}</small>`;
      }
    }).catch((error) => {
      const loader = document.getElementById("loader");
      loader.innerHTML = `<strong>模型载入失败</strong><small>${String(error.message || error)}</small>`;
    });
  </script>
</body>
</html>
