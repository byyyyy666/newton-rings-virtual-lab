<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牛顿环 — 曲率半径 · 波长 · 介质折射率</title>
<style>
  :root {
    --bg: #ffffff; --bg-panel: #f7f8fa; --bg-surface: #edeff3;
    --brand: #b8860b; --accent: #c9952e;
    --lens-blue: #3a6d99;
    --text-primary: #1a1d22; --text-secondary: #555a62; --text-dim: #8a8e96;
    --border-subtle: #d5d8de; --border-active: #b0b5be;
    --nav-h: 48px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html {
    font-size: 16px; scroll-behavior: smooth;
    background: var(--bg); color: var(--text-primary);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; line-height: 1.6;
  }
  body { min-height: 100vh; padding-top: var(--nav-h); }
  .nav {
    position: fixed; top:0; left:0; right:0; z-index:100;
    height: var(--nav-h); background: var(--bg);
    border-bottom: 1px solid var(--border-subtle);
    display: flex; align-items: center;
    padding: 0 24px;
  }
  .nav-brand { font-family: 'DM Serif Display', Georgia, serif; font-size:1rem; color:var(--brand); letter-spacing:0.02em; }

  .main-grid {
    display: grid;
    grid-template-columns: 35% 40% 25%;
    height: calc(100vh - var(--nav-h));
    border-bottom: 1px solid var(--border-subtle);
  }

  /* ── Left: optical path diagram ── */
  .optical-panel {
    background: var(--bg-panel);
    border-right: 1px solid var(--border-subtle);
    display: flex; flex-direction: column;
    padding: 6px 4px;
    overflow-y: auto;
  }
  .panel-title {
    font-size: 0.85rem;
    text-align: center; font-size: 0.85rem;
    color: var(--lens-blue); letter-spacing: 0.04em;
    margin-bottom: 6px; flex-shrink: 0;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border-subtle);
  }
  .optical-svg-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    min-height: 0; position: relative;
  }
  .optical-svg-wrap img {
    width: 100%; height: 100%; object-fit: contain; border-radius: 4px; display: block;
  }
  #optOverlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* ── Center: rings ── */
  .center-col {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    position: relative;
    padding: 2px 0;
  }

  .center-guide {
    position: absolute; top: 0; bottom: 0; left: 50%;
    width: 1px;
    background: repeating-linear-gradient(to bottom, var(--lens-blue) 0px, var(--lens-blue) 3px, transparent 3px, transparent 10px);
    opacity: 0.08; z-index: 0; pointer-events: none;
  }

  .rings-section {
    display: flex; align-items: center; justify-content: center;
    flex: 1; position: relative; min-height: 0;
    padding: 8px 0;
  }
  .rings-section canvas {
    display: block; border-radius: 50%;
    background: #0e1018;
    box-shadow: 0 0 30px rgba(0,0,0,0.06), 0 0 60px rgba(0,0,0,0.03);
  }
  .rings-reticle {
    position: absolute; pointer-events: none;
    top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1;
  }
  .rings-reticle::before, .rings-reticle::after {
    content: ''; position: absolute; background: var(--lens-blue); opacity: 0.25;
  }
  .rings-reticle::before { width: 1px; height: 50px; top: -25px; left: 0; }
  .rings-reticle::after  { width: 50px; height: 1px; left: -25px; top: 0; }

  /* ── Right: controls ── */
  .controls-panel {
    background: var(--bg-panel); padding: 14px 14px;
    display: flex; flex-direction: column; gap: 32px;
    overflow-y: auto; border-left: 1px solid var(--border-subtle);
    align-items: stretch; text-align: left;
  }
  .ctrl-group { display: flex; flex-direction: column; gap: 2px; width: 100%; }
  .ctrl-label {
    font-size: 1.05rem;
    display: flex; justify-content: flex-start; align-items: baseline; gap: 6px;
    color: var(--text-primary);
  }
  .ctrl-label .symbol { color: var(--brand); font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 800; }
  .ctrl-value { font-family: 'JetBrains Mono', monospace; font-size: 1.05rem; color: var(--brand); font-weight: 800; }
  .ctrl-desc { font-size: 0.72rem; color: var(--text-dim); line-height: 1.3; text-align: left; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; border-radius: 3px; background: var(--border-active); border-radius: 2px; outline: none;
    margin: 0;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--brand); cursor: pointer;
    box-shadow: 0 0 6px rgba(184,134,11,0.3); transition: box-shadow 0.2s;
  }
  input[type="range"]::-webkit-slider-thumb:hover { box-shadow: 0 0 12px rgba(184,134,11,0.4); }

  .formula-box {
    background: var(--bg-surface); border: 1px solid var(--border-subtle);
    border-radius: 5px; padding: 7px 8px;
    font-family: 'JetBrains Mono', monospace; 
    font-size: 0.78rem;
    line-height: 1.6; color: var(--lens-blue);
    text-align: center; width: 100%;
  }
  .formula-box .hl { color: var(--accent); font-weight: 700; }

  .lambda-color-swatch {
    width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--border-active);
    display: inline-block; vertical-align: middle; margin-left: 2px; flex-shrink: 0;
  }

  .footer {
    border-top: 1px solid var(--border-subtle); padding: 6px 32px; text-align: center;
    
    font-size: 0.78rem; color: var(--text-dim); letter-spacing: 0.03em;
    background: var(--bg);
  }

  @media (max-width: 960px) {
    .main-grid { grid-template-columns: 1fr; height: auto; }
    .optical-panel { border-right: none; border-bottom: 1px solid var(--border-subtle); max-height: 220px; }
    .controls-panel { border-left: none; border-top: 1px solid var(--border-subtle); }
  }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 2px; }
  .nav { display: none !important; }
  body { padding-top: 0 !important; }
  .main-grid { height: 100vh !important; }
  @media (max-width: 960px) {
    .main-grid { height: auto !important; min-height: 100vh; }
  }
</style>
</head>
<body>

<nav class="nav"><span class="nav-brand">Newton's Rings</span></nav>

<div class="main-grid">

  <!-- ═══ LEFT: Optical Path Diagram ═══ -->
  <div class="optical-panel">
    <div class="panel-title"></div>
    <div class="optical-svg-wrap">
      <img id="labPhoto"
           src="装置.jpg"
           alt="实验装置图"/>
      <canvas id="optOverlay"></canvas>
    </div>
  </div>

  <!-- ═══ CENTER: Rings + Apparatus ═══ -->
  <div class="center-col">
    <div class="panel-title"></div>
    <div class="center-guide"></div>

    <div class="rings-section">
      <canvas id="ringsCanvas" width="500" height="500"></canvas>
      <div class="rings-reticle"></div>
    </div>
  </div>

  <!-- ═══ RIGHT: Controls ═══ -->
  <div class="controls-panel">
    <div class="panel-title">参数控制区</div>
    <div class="ctrl-group">
      <div class="ctrl-label"><span><span class="symbol">R</span> 曲率半径</span><span class="ctrl-value" id="valR">1.20 m</span></div>
      <input type="range" id="sliderR" min="0.3" max="3" step="0.01" value="1.2">
      <div class="ctrl-desc">越大条纹越稀疏</div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-label">
        <span><span class="symbol">λ</span> 入射波长</span>
        <span class="lambda-color-swatch" id="lambdaSwatch"></span>
        <span class="ctrl-value" id="valLambda">589 nm</span>
      </div>
      <input type="range" id="sliderLambda" min="380" max="780" step="1" value="589">
      <div class="ctrl-desc">可见光 380-780 nm</div>
    </div>
    <div class="ctrl-group">
      <div class="ctrl-label"><span><span class="symbol">n</span> 介质折射率</span><span class="ctrl-value" id="valN">1.00</span></div>
      <input type="range" id="sliderN" min="1" max="2.5" step="0.01" value="1">
      <div class="ctrl-desc">空气 1.00 · 水 1.33 · 油/玻璃 1.50</div>
    </div>
    <div class="formula-box">
      <div style="display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:4px;flex-wrap:wrap;">
        <span style="font-size:0.88rem;font-weight:800;color:var(--text-primary);flex-shrink:0;">第</span>
        <select id="ringOrder" style="background:var(--bg);color:var(--text-primary);border:1px solid var(--border-active);border-radius:3px;padding:2px 4px;font-family:'JetBrains Mono',monospace;font-size:0.88rem;font-weight:800;cursor:pointer;">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option>
          <option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option>
        </select>
        <span style="font-size:0.88rem;font-weight:800;color:var(--text-primary);flex-shrink:0;">级</span>
        <select id="ringType" style="background:var(--bg);color:var(--text-primary);border:1px solid var(--border-active);border-radius:3px;padding:2px 4px;font-family:'JetBrains Mono',monospace;font-size:0.88rem;font-weight:800;cursor:pointer;">
          <option value="dark">暗环</option>
          <option value="bright">明环</option>
        </select>
      </div>
      <div id="r1Display" class="hl" style="font-size:0.9rem;font-weight:800;font-family:'JetBrains Mono',monospace;"></div>
    </div>
  </div>
</div>

<footer class="footer">牛顿环干涉仿真 · 曲率半径 R · 波长 λ · 介质折射率 n</footer>

<script>
const ringsCanvas = document.getElementById('ringsCanvas');
const ringsCtx = ringsCanvas.getContext('2d');

let R = 1.2, lambda = 589, n_medium = 1.0;

const sliderR = document.getElementById('sliderR');
const sliderLambda = document.getElementById('sliderLambda');
const sliderN = document.getElementById('sliderN');
const valR = document.getElementById('valR');
const valLambda = document.getElementById('valLambda');
const valN = document.getElementById('valN');
const r1Display = document.getElementById('r1Display');
const ringOrder = document.getElementById('ringOrder');
const ringType = document.getElementById('ringType');
const lambdaSwatch = document.getElementById('lambdaSwatch');

// ── Wavelength (nm) → RGB for visible colour ──
function wavelengthToRGB(nm) {
  let r=0, g=0, b=0;
  if (nm >= 380 && nm < 440) {
    r = -(nm-440)/(440-380); g = 0; b = 1;
  } else if (nm >= 440 && nm < 490) {
    r = 0; g = (nm-440)/(490-440); b = 1;
  } else if (nm >= 490 && nm < 510) {
    r = 0; g = 1; b = -(nm-510)/(510-490);
  } else if (nm >= 510 && nm < 580) {
    r = (nm-510)/(580-510); g = 1; b = 0;
  } else if (nm >= 580 && nm < 645) {
    r = 1; g = -(nm-645)/(645-580); b = 0;
  } else if (nm >= 645 && nm <= 780) {
    r = 1; g = 0; b = 0;
  }
  let factor = 1;
  if (nm >= 380 && nm < 420) factor = 0.3 + 0.7*(nm-380)/(420-380);
  else if (nm >= 645 && nm <= 780) factor = 0.3 + 0.7*(780-nm)/(780-645);
  return [
    Math.round(Math.max(0, Math.min(1, r*factor)) * 255),
    Math.round(Math.max(0, Math.min(1, g*factor)) * 255),
    Math.round(Math.max(0, Math.min(1, b*factor)) * 255)
  ];
}

function updateLambdaSwatch() {
  const [rr, gg, bb] = wavelengthToRGB(lambda);
  lambdaSwatch.style.background = `rgb(${rr},${gg},${bb})`;
}

// ── Render Newton's rings with wavelength colour mapping ──
function renderRings() {
  const w = ringsCanvas.width, h = ringsCanvas.height;
  const imageData = ringsCtx.createImageData(w, h);
  const data = imageData.data;
  const rMax = 0.0025, cx = w/2, cy = h/2;
  const scale = rMax / (Math.min(w,h)/2);
  const lambdaM = lambda * 1e-9;

  const [wlR, wlG, wlB] = wavelengthToRGB(lambda);

  for (let py=0; py<h; py++) {
    for (let px=0; px<w; px++) {
      const idx = (py*w+px)*4;
      const r = Math.sqrt((px-cx)*(px-cx)+(py-cy)*(py-cy)) * scale;
      const phase = Math.PI * n_medium * r * r / (lambdaM * R);
      const I = Math.sin(phase) * Math.sin(phase);
      data[idx]     = Math.round(wlR * I + 8*(1-I));
      data[idx+1]   = Math.round(wlG * I + 6*(1-I));
      data[idx+2]   = Math.round(wlB * I + 10*(1-I));
      data[idx+3]   = 255;
    }
  }
  ringsCtx.putImageData(imageData, 0, 0);
}

// ── Draw optical path on canvas overlay ──
function updateOpticalPath() {
  const canvas = document.getElementById('optOverlay');
  if (!canvas) return;
  const img = document.getElementById('labPhoto');
  if (!img) return;

  const wrap = canvas.parentElement;
  const cw = wrap.clientWidth;
  const ch = wrap.clientHeight;
  if (cw === 0 || ch === 0) return;

  // Resize canvas to match container
  canvas.width  = cw;
  canvas.height = ch;

  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, cw, ch);

  // ── Compute rendered image rect (object-fit: contain) ──
  const natW = img.naturalWidth  || 1183;
  const natH = img.naturalHeight || 1520;
  const imgAspect = natW / natH;
  const conAspect = cw / ch;

  let imgW, imgH;
  if (imgAspect < conAspect) { imgH = ch; imgW = ch * imgAspect; }
  else                        { imgW = cw; imgH = cw / imgAspect; }
  const imgX = (cw - imgW) / 2;
  const imgY = (ch - imgH) / 2;

  // Convert image-fraction → canvas px
  function p(fx, fy) { return [imgX + fx * imgW, imgY + fy * imgH]; }

  // ── Key component positions (tuned to photo layout) ──
  //  Photo layout (portrait):
  //   A laser unit     → bottom-left
  //   B expander lens  → lower-centre on post
  //   F beam splitter  → 45° tilted plate, mid-right (same height as B)
  //   C/D frame        → mid-right, above F
  //   E CCD camera     → upper-right
  //   G/H Newton rings → bottom-right trough
  const LASER    = p(0.155, 0.632); // A — laser aperture (bottom-left box, beam exits right)
  const LENS     = p(0.365, 0.632); // B — plano-convex expander blade (centre, on beam line)
  const SPLIT    = p(0.685, 0.632); // F — 45° beam-splitter plate (mid-right, on beam line)
  const FRAME    = p(0.685, 0.410); // C/D — reference/compensating frame (rectangle, above F)
  const CCD      = p(0.685, 0.215); // E — CCD camera (top-right, on the vertical up-beam)
  const NEWTON   = p(0.685, 0.895); // G/H — Newton's rings apparatus (raised so the bottom flat mirror sits on the black table base)

  // Beam colour
  const [wr, wg, wb] = wavelengthToRGB(lambda);
  const rgb  = `rgb(${wr},${wg},${wb})`;

  // ── Helpers ──
  function beam(x1,y1,x2,y2, width=2.2, dashArr=[], alpha=0.88) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.setLineDash(dashArr);
    // soft glow
    ctx.globalAlpha = 0.15;
    ctx.strokeStyle = rgb;
    ctx.lineWidth = width * 5;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    // core
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = rgb;
    ctx.lineWidth = width;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    ctx.restore();
  }

  function arrow(x, y, angleDeg, sz=9) {
    const a = angleDeg * Math.PI / 180;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(a);
    ctx.fillStyle = rgb;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-sz, -sz * 0.45);
    ctx.lineTo(-sz * 0.55, 0);
    ctx.lineTo(-sz, sz * 0.45);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  // label function removed — no text in left panel


  // ── 1+2+3. Diverging fan A→B, refracted at lens B into horizontal parallel
  //         rays. Each parallel ray lands at its OWN point along the 45° plate F
  //         (higher rays hit further left on the "\" edge), then reflects
  //         straight down to the Newton's rings G/H. ──
  const dxAB    = LENS[0] - LASER[0];
  const NRAYS   = 11;                 // number of rays across the fan (≥10)
  const halfDeg = 20;                 // ±20° from centre → 40° apex angle
  const apAB    = dxAB * Math.tan(halfDeg * Math.PI / 180); // lens half-aperture

  // ── Newton's rings apparatus geometry (computed up front so beams connect) ──
  const nCx     = NEWTON[0];
  const nHalfW  = imgW * 0.185;
  const nEdgeH  = 0;
  const nSag    = Math.max(imgH*0.010, Math.min(imgH*0.052, imgH*0.055 * (1.2 / R)));
  const nMirrorY = NEWTON[1] + imgH * 0.052;  // FIXED mirror top, never moves with R
  const nYCont  = nMirrorY;                    // lens apex always touches mirror
  const nYEdge  = nMirrorY - nSag;             // edges lift up as R decreases
  const nYTop   = nYEdge - nEdgeH;             // flat top rises with edges
  const nGlass  = 1.50;                       // lens glass index
  const nSurfY  = (u) => nYCont - nSag*u*u;   // convex lower surface, u=(x-nCx)/nHalfW

  // 45° plate "" passes through SPLIT: point at height y sits at x = SPLIT[0] + (y - SPLIT[1])
  const F_PLATE_THICKNESS = imgW * 0.018;  // glass plate thickness in visual pixels
  const F_INDEX = 1.52;                    // typical glass index
  const F_DISP = F_PLATE_THICKNESS * Math.sin(45 * Math.PI / 180) * (1 - 1/Math.cos(Math.asin(Math.sin(45 * Math.PI / 180) / F_INDEX)));
  // lateral displacement (scaled): beam enters/leaves F plate offset but parallel
  const F_LATERAL = F_DISP * 3.5;  // amplified for visual clarity
  const landHits = [];   // x-positions where down-beams strike the lens flat top
  for (let i = 0; i < NRAYS; i++) {
    const t   = NRAYS === 1 ? 0.5 : i / (NRAYS - 1);   // 0..1
    const deg = -halfDeg + t * 2 * halfDeg;            // -20°..+20°
    const yB  = LENS[1] + dxAB * Math.tan(deg * Math.PI / 180); // hit height on B
    const isCentre = Math.abs(deg) < 1e-6;
    const wCore = isCentre ? 2.4 : 1.1;
    const aCore = isCentre ? 0.88 : 0.42;
    const hitX  = SPLIT[0] + (yB - SPLIT[1]);          // landing point on the 45° edge
    // (1) diverging segment: A → point on lens B (front surface)
    beam(LASER[0], LASER[1], LENS[0], yB, wCore, [], aCore);
    // (2) horizontal through F plate: air→glass (offset down-right slightly), glass→air (offset back)
    const f1 = hitX - F_PLATE_THICKNESS / 1.414;  // entry face of 45° plate at this y-level
    const f2 = hitX + F_PLATE_THICKNESS / 1.414;  // exit face
    beam(LENS[0], yB, f1, yB, wCore, [], aCore);       // before F
    beam(f1, yB, f2, yB + F_LATERAL, wCore, [], aCore); // through F plate (offset down)
    // after F → horizontal to splitter reference point (virtual continuation)
    // beam continues horizontally to hitX conceptually
    // (3) reflected segment: straight down from landing point → lens flat top
    //     (only rays that actually strike the lens aperture reach the apparatus)
    const onLens = (hitX >= nCx - nHalfW && hitX <= nCx + nHalfW);
    beam(hitX, yB, hitX, onLens ? nYTop : NEWTON[1], wCore, [], aCore);
    if (onLens) landHits.push({ x: hitX, w: wCore, a: aCore });
  }
  arrow(LENS[0], LENS[1], 0);                 // into lens
  arrow(NEWTON[0], nYTop, 90);                // down onto lens flat top

  // ── 4. Return path: G/H → F → up to frame C → converge between C/D → CCD E ──
  //   (a) reflected light returns from the Newton apparatus up to splitter F
  beam(NEWTON[0], nYTop, SPLIT[0], SPLIT[1], 1.8, [6,5], 0.5);

  //   (b) from F's upper (slant) surface, the rays go straight UP through C
  //       (staying VERTICAL until they exit C's upper surface), then converge
  //       (gently) to ONE point above C.
  const yCbot  = FRAME[1] + imgH * 0.035;   // C — lower surface of the frame
  const yCtop  = FRAME[1] - imgH * 0.027;   // C — upper surface of the frame
  const yDbot  = FRAME[1] - imgH * 0.075;   // D — lower surface of the frame
  const yFocus = (yCbot + yDbot) / 2; // convergence point — exact middle of the C–D gap: rays converge from C's upper surface, cross here, then diverge to D
  // Up-going rays are matched ONE-TO-ONE with the down-going rays that actually
  // landed on the lens (landHits): same count, same x-positions, and the same
  // per-ray width/alpha — so F's output band lines up exactly with its input.
  // After the focus the rays DIVERGE again, but with a noticeably SMALLER angle
  // than they converged with. DIVERGE < 1 shrinks the spread at D's lower surface
  // relative to the spread the rays had entering the focus.
  // Divergence angle of the OUTERMOST ray, measured from the vertical, fixed at 15°.
  // The fan runs from the focus up to D's lower surface (vertical run = yFocus - yDbot);
  // the widest ray lands at maxHalf = run * tan(15°), and inner rays scale proportionally.
  const DIV_DEG   = 15;                                   // half-fan angle from vertical
  const upRun     = yFocus - yDbot;                       // vertical distance focus → D lower surface
  const maxHalf   = upRun * Math.tan(DIV_DEG * Math.PI / 180);
  let maxOff = 1e-6;                                      // largest |x - axis| among landing rays
  for (const h of landHits) maxOff = Math.max(maxOff, Math.abs(h.x - FRAME[0]));
  for (const hit of landHits) {
    const x  = hit.x;                       // aligned with the incoming down-beam
    const yF = SPLIT[1] + (x - SPLIT[0]);   // point on F's 45° slant "\" directly below x
    // vertical segment: F upper surface → straight up to C lower surface
    beam(x, yF, x, yCbot, hit.w, [], hit.a);
    // between the two frame lenses C and D: converge then diverge
    // from C lower surface the rays converge to the focus in the middle of C-D
    beam(x, yCbot, FRAME[0], yFocus, hit.w, [], hit.a);
    // after the focus → diverge symmetrically to D lower surface (mirror of convergence)
    // then exit VERTICALLY up to the CCD
    const xD = FRAME[0] + (x - FRAME[0]) / maxOff * maxHalf;
    beam(FRAME[0], yFocus, xD, yDbot, hit.w, [], hit.a);
    // exit straight up from D upper surface → all the way up to the CCD E
    beam(xD, yDbot, xD, CCD[1], hit.w, [], hit.a);
  }
  arrow(CCD[0], CCD[1], -90, 8);

  // ── 5. Beam splitter icon: 45° plate "\" spanning the full beam band ──
  const bsHalf = apAB + imgW * 0.012;         // plate long enough to catch every ray
  ctx.save();
  ctx.globalAlpha = 0.7;
  ctx.strokeStyle = 'rgba(160,200,230,0.95)';
  ctx.lineWidth = 3;
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(SPLIT[0] - bsHalf, SPLIT[1] - bsHalf);
  ctx.lineTo(SPLIT[0] + bsHalf, SPLIT[1] + bsHalf);
  ctx.stroke();
  ctx.restore();

  // ── 6. Newton's rings apparatus at G/H ──
  //   plano-convex lens (curvature ∝ 1/R) + air film (colour ∝ n) + flat mirror
  {
    const cx    = nCx, halfW = nHalfW, yTop = nYTop;
    const edgeH = nEdgeH, sag = nSag, yEdge = nYEdge, yContact = nYCont;
    const plateH = imgH * 0.016;
    const plateHalfW = halfW;
    const NSEG = 40;                         // curve segments
    const surfY = nSurfY;                    // convex lower surface

    // (a) air film wedge — colour deepens as medium index n increases
    const hue  = 190 + (n_medium - 1) / (2.5 - 1) * 110;   // cyan → magenta
    const tN   = (n_medium - 1) / (2.5 - 1);               // 0..1
    const lite = 68 - tN * 42;                             // lightness 68% → 26% (darker)
    const alph = 0.42 + tN * 0.45;                         // 0.42 → 0.87 (denser)
    ctx.save();
    ctx.beginPath();
    for (let i=0;i<=NSEG;i++){ const u=-1+2*i/NSEG; const x=cx+u*halfW; const y=surfY(u); i?ctx.lineTo(x,y):ctx.moveTo(x,y); }
    ctx.lineTo(cx+halfW, yContact);
    ctx.lineTo(cx-halfW, yContact);
    ctx.closePath();
    ctx.fillStyle = `hsla(${hue},72%,${lite}%,${alph})`;
    ctx.fill();
    ctx.restore();

    // (b) interior rays: start at the SAME x where each down-beam lands on the flat
    //     top (aligned with the incoming rays), enter at normal incidence (no bend),
    //     refract at the convex glass→air surface (Snell), reach the mirror, reflect up
    ctx.save();
    const CONVERGE = 0.18;   // small convergence factor toward centre axis in the film
    for (const hit of landHits){
      const x  = hit.x;
      const u  = (x - cx) / halfW;             // fractional position across lens
      const ys = surfY(u);                     // exit point on convex surface
      // In the thin air film, the ray bends slightly TOWARD the centre axis so the
      // beams converge a little on their way down to the mirror (not to a single
      // point — just a gentle convergence). Offset ∝ distance from axis.
      const xHit = x - (x - cx) * CONVERGE;    // landing point on mirror, pulled inward
      beam(x, yTop, x, ys, 1.0, [], 0.30);          // through the glass (straight)
      beam(x, ys, xHit, yContact, 1.0, [], 0.55);   // refracted in film → mirror
      beam(xHit, yContact, x, ys, 0.8, [4,4], 0.32);// reflected back up (dashed)
    }
    ctx.restore();

    // (c) plano-convex lens body (flat top, convex bottom)
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx-halfW, yTop);
    ctx.lineTo(cx+halfW, yTop);
    ctx.lineTo(cx+halfW, yEdge);
    for (let i=NSEG;i>=0;i--){ const u=-1+2*i/NSEG; ctx.lineTo(cx+u*halfW, surfY(u)); }
    ctx.lineTo(cx-halfW, yEdge);
    ctx.closePath();
    ctx.fillStyle = 'rgba(185,210,230,0.30)';
    ctx.strokeStyle = 'rgba(150,180,205,0.95)';
    ctx.lineWidth = 1.5;
    ctx.fill(); ctx.stroke();
    ctx.restore();

    // (d) bottom flat mirror
    ctx.save();
    const my = yContact;
    ctx.fillStyle = 'rgba(120,130,145,0.9)';
    ctx.fillRect(cx-plateHalfW, my, plateHalfW*2, plateH);
    ctx.strokeStyle = 'rgba(70,80,95,0.95)';
    ctx.lineWidth = 1;
    ctx.strokeRect(cx-plateHalfW, my, plateHalfW*2, plateH);
    ctx.strokeStyle = 'rgba(70,80,95,0.7)';
    for (let x=cx-plateHalfW; x<cx+plateHalfW; x+=6){
      ctx.beginPath(); ctx.moveTo(x, my+plateH); ctx.lineTo(x+4, my+plateH+4); ctx.stroke();
    }
    ctx.restore();

    // (e) labels removed
  }

  // ── Labels removed ──
}

// ── Master update ──
function updateAll() {
  updateLambdaSwatch();
  renderRings();
  updateOpticalPath();
  const m = parseInt(ringOrder.value);
  const isDark = ringType.value === 'dark';
  const effectiveM = isDark ? m : (m - 0.5);
  const r1 = Math.sqrt(effectiveM * lambda * 1e-9 * R / n_medium) * 1e3;
  const label = isDark ? '暗环' : '明环';
  r1Display.textContent = `第${m}级${label} r = ${r1.toFixed(3)} mm`;
}

sliderR.addEventListener('input', ()=>{
  R=+sliderR.value; valR.textContent=R.toFixed(2)+' m'; updateAll();
});
sliderLambda.addEventListener('input', ()=>{
  lambda=+sliderLambda.value; valLambda.textContent=lambda+' nm'; updateAll();
});
sliderN.addEventListener('input', ()=>{
  n_medium=+sliderN.value; valN.textContent=n_medium.toFixed(2); updateAll();
});
ringOrder.addEventListener('change', updateAll);
ringType.addEventListener('change', updateAll);

document.addEventListener('keydown', (e)=>{
  if (e.target.tagName==='INPUT'||e.target.tagName==='SELECT') return;
  const step = e.shiftKey ? 0.1 : 0.01;
  if (e.key==='ArrowUp'||e.key==='ArrowRight') { e.preventDefault(); R=Math.min(3,R+step); sliderR.value=R; valR.textContent=R.toFixed(2)+' m'; updateAll(); }
  else if (e.key==='ArrowDown'||e.key==='ArrowLeft') { e.preventDefault(); R=Math.max(0.3,R-step); sliderR.value=R; valR.textContent=R.toFixed(2)+' m'; updateAll(); }
});

function syncSizes() {
  const col = document.querySelector('.center-col');
  if (!col) return;
  const maxW = Math.min(col.clientWidth - 16, 520);
  const size = Math.max(280, maxW);
  ringsCanvas.style.width = size + 'px';
  ringsCanvas.style.height = size + 'px';
}

window.addEventListener('resize', () => { syncSizes(); updateOpticalPath(); });
syncSizes();

// Wait for image to load before first draw
const labPhoto = document.getElementById('labPhoto');
if (labPhoto && labPhoto.complete) {
  updateAll();
} else if (labPhoto) {
  labPhoto.addEventListener('load', updateAll);
  updateAll(); // also draw once immediately (canvas only, image may be missing)
} else {
  updateAll();
}
</script>
</body>
</html>
